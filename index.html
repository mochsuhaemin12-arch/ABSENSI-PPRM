   const col={};rows[hi].forEach((c,i)=>{const k=norm(c);if(isId(k)){if(col.id==null)col.id=i}else if(k.startsWith('nama')){if(col.nama==null)col.nama=i}else if(k.startsWith('alamat'))col.alamat=i;else if(k.startsWith('domisili')||k=='kamar'||k=='asrama')col.dom=i;else if(k=='kelasmadin'||k=='madin'||k=='kelasdiniyah')col.madin=i;else if(k=='kelasformal'||k=='formal'||k=='kelassekolah')col.formal=i;else if(k=='updatestatus'||k=='keterangan'||k=='ket'||k=='status')col.ket=i});
   if(col.nama==null)throw new Error('Kolom "Nama" tidak ditemukan di baris judul');
   const g=(r,k)=>col[k]==null?'':String(r[col[k]]??'').trim();
   const map=new Map();let skip=0;
   rows.slice(hi+1).forEach(r=>{let id=g(r,'id').replace(/\.0+$/,'');const o={id,nama:g(r,'nama'),alamat:g(r,'alamat'),dom:g(r,'dom'),madin:g(r,'madin'),formal:g(r,'formal'),ket:g(r,'ket')};
    if(!o.id||!o.nama){if(r.some(c=>String(c).trim()))skip++;return}
    map.set(o.id,o)});
   let add=0,upd=0;const jobs=[];
   map.forEach(o=>{const ex=S.students.find(s=>String(s.id)==o.id);
    if(ex){const m={...ex};['nama','alamat','dom','madin','formal','ket'].forEach(k=>{if(col[k]!=null)m[k]=o[k]});jobs.push(m);upd++}else{jobs.push({...o,active:true});add++}});
   if(!jobs.length)throw new Error('Tidak ada baris data yang valid (ID PPRM dan Nama wajib diisi)');
   let done=0,fail=0,lastErr='';
   const put=async s=>{for(let t=0;t<4;t++){try{await putStudent(s);return}catch(e){lastErr=e;if(t==3)throw e;await new Promise(r=>setTimeout(r,500*(t+1)))}}};
   await pool(jobs,3,async s=>{try{await put(s)}catch(e){fail++}done++;if(done%5==0||done==jobs.length)say('Menyimpan '+done+' / '+jobs.length+' santri…')});
   say((fail?'⚠ ':'✔ ')+'Impor selesai. Ditambah: '+add+' · Diperbarui: '+upd+' · Dilewati: '+skip+(fail?' · Gagal simpan: '+fail+' ('+errMsg(lastErr)+')':''));
  }catch(x){say('⚠ Gagal impor: '+(x&&x.message||x))}
  finally{try{inp.value=''}catch(e){}}};
 $('#tb').onclick=async ev=>{const b=ev.target.dataset,id=b.e||b.t||b.x,s=S.students.find(x=>String(x.id)==id);if(!s)return;
  if(b.e){edit=s.id;stu()}else if(b.t){W(()=>putStudent({...s,active:!s.active}))}
  else if(sure(ev.target,'Yakin hapus?')){W(()=>delStudent(s.id),'Santri dihapus')}};
}

const wib=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{date:p.year+'-'+p.month+'-'+p.day,hms:p.hour+':'+p.minute+':'+p.second}};
const sec=h=>{const a=String(h||'0').split(':').map(Number);return a[0]*3600+(a[1]||0)*60+(a[2]||0)};
const hm=h=>h?String(h).slice(0,5):'–';

const curW=()=>{const n=sec(wib().hms);return n<sec(JD.masuk)?'Absensi Belum Dibuka':n<sec(JD.pulang)?'Waktu Absensi Masuk':n<=sec(JD.tutup)?'Waktu Absensi Pulang':'Absensi Ditutup'};

/* Absensi masuk/pulang */
function pre(){
 let last=null,sak=false;
 const MD=['Absensi Harian (Masuk / Pulang)',...ACTS],cm=()=>$('#am').value,hari=()=>cm()==MD[0];
 M.innerHTML=`<div class=stg><div class=row><label class=lb>Jenis absensi<select id=am>${MD.map(a=>`<option>${a}</option>`).join('')}</select></label><button class=s id=bs></button><span class=sw id=sw></span><b class=jam id=jam style="font-size:26px;color:var(--head)"></b><span class=note id=tgl></span></div><div class=big><div><div class=bph id=bph></div><input id=idin class=bin placeholder="Scan / ketik ID PPRM lalu Enter" autocomplete=off></div><div><div class=bhd id=bhd></div><div id=bi></div></div></div><div id=ps></div></div>`;
 const btn=()=>{const b=$('#bs');b.textContent=sak?'🤒 Mode Sakit AKTIF: scan berikutnya = Sakit':'🤒 Absen Sakit';b.className=sak?'':'s'};
 const panel=()=>{const l=last,p=$('#bph'),h=$('#bhd');

async function restore(o){
 if(!o||!Array.isArray(o.students))throw 0;
 const ops=[];
 o.students.forEach(s=>s&&s.id!=null&&String(s.id)&&ops.push(()=>putStudent(s)));
 const g={};
 (o.att||[]).forEach(x=>{if(!x||x.sid==null||!x.date||ACTS.indexOf(x.act)<0)return;const id=x.date+'_'+ACTS.indexOf(x.act);(g[id]=g[id]||{date:x.date,act:x.act,m:{...((AD[id]||{}).m||{})}}).m[seg(x.sid)]={id:String(x.sid),s:x.st,t:x.time||''}});
 Object.entries(g).forEach(([id,v])=>ops.push(()=>DB.doc('att/'+id).set(clean(v))));
 (o.rekap||[]).forEach(r=>r&&r.id!=null&&ops.push(()=>DB.doc('rekap/'+seg(r.id)).set(clean(r))));
 if(o.set)ops.push(()=>DB.doc('meta/set').set(clean({...DEF,...o.set})));
 const fail=await pool(ops,4,f=>f());return {total:ops.length,fail};
}

const SUPABASE_URL='https://ptoupxetorhkdasfeykv.supabase.co';      // contoh: https://abcdxyz.supabase.co
const SUPABASE_KEY='sb_publishable_iut8gQMgN9D7o04r2BwNcQ_uqrnQjTD';  // kunci "anon public" (aman dipublikasikan, dijaga RLS)
const T='docs',fail=e=>{const x=new Error(e.message);x.code=e.code=='42501'?'invalid_argument':e.code;return x};
function makeDB(sb){
  const dsnap=(path,row)=>({exists:!!row,id:path.split('/').pop(),data:()=>row?row.data:undefined});
  const doc=path=>({
    async set(d){const{error}=await sb.from(T).upsert({path,data:d,updated_at:new Date().toISOString()});if(error)throw fail(error)},
    async update(d){const{error}=await sb.rpc('merge_doc',{p_path:path,p_patch:d});if(error)throw fail(error)},
    async delete(){const{error}=await sb.from(T).delete().eq('path',path);if(error)throw fail(error)},
    onSnapshot(cb,err){
      const load=async()=>{const{data,error}=await sb.from(T).select('path,data').eq('path',path).maybeSingle();error?err&&err(fail(error)):cb(dsnap(path,data))};
      load();sb.channel('d:'+path).on('postgres_changes',{event:'*',schema:'public',table:T,filter:'path=eq.'+path},load).subscribe();
    }
  });
  const collection=name=>({
    onSnapshot(cb,err){
      const pre=name+'/',rows=new Map(),emit=()=>cb({docs:[...rows.values()].map(r=>({id:r.path.slice(pre.length),data:()=>r.data}))});
      (async()=>{
        for(let f=0;;f+=1000){
          const{data,error}=await sb.from(T).select('path,data').like('path',pre+'%').order('path').range(f,f+999);
          if(error)return err&&err(fail(error));
          data.forEach(r=>rows.set(r.path,r));if(data.length<1000)break;
        }
        emit();
      })();
      sb.channel('c:'+name).on('postgres_changes',{event:'*',schema:'public',table:T},pl=>{
        const r=pl.eventType=='DELETE'?pl.old:pl.new;if(!r||!String(r.path).startsWith(pre))return;
        pl.eventType=='DELETE'?rows.delete(r.path):rows.set(r.path,r);emit();
      }).subscribe();
    }
  });
  return{doc,collection};
}
